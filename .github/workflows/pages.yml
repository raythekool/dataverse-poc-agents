name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/**
      - scripts/build-site.mjs
      - plugins/dataverse-poc/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The live demos are generated with the plugin's own scaffold (npm install inside a temp POC).
      - name: Build site
        run: >
          node scripts/build-site.mjs --out _site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          --repo-url "https://github.com/${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
