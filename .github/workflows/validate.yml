name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-plugin.mjs
      # Unit tests of the plugin scripts plus an end-to-end scaffold (npm install, build, smoke test with Chrome).
      - run: node --test tests/*.test.mjs
      - run: node scripts/build-site.mjs --out _site --no-demo
